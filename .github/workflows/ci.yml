name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only PyTorch first)
        run: |
          pip install -r requirements-cpu.txt
          pip install -r requirements.txt
      # Includes tests/test_openapi.py, which fails if web/openapi.json no
      # longer matches the API.
      - run: python -m pytest -q tests

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generated API types match web/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install API dependencies
        run: |
          pip install -r requirements-cpu.txt
          pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Playwright starts uvicorn (serving the committed checkpoints) and
      # the Vite dev server itself; see web/playwright.config.ts.
      - name: Run Playwright
        working-directory: web
        run: npm run test:e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

# Deployment is not a job here: Render deploys the API (render.yaml, once
# these checks pass) and Vercel deploys web/, both straight from GitHub.
