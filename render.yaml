# Render Blueprint for the API. In the Render dashboard: New > Blueprint,
# pick this repository, and Render creates the service below and redeploys
# it whenever main changes.
services:
  - type: web
    name: robustness-explorer-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy a commit only once its GitHub CI checks have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: VISION_CORS_ORIGINS
        value: https://vision-robustness-benchmark.vercel.app
